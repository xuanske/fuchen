<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1100">
  <rect width="750" height="1100" fill="#f4efe6"/>
  <rect x="40" y="40" width="670" height="1020" fill="none" stroke="#ddd4c6"/>
  <rect x="80" y="88" width="72" height="72" fill="none" stroke="#8a6a3b"/>
  <text x="116" y="134" text-anchor="middle" font-family="Songti SC, STSong, serif" font-size="22" fill="#8a6a3b">尘</text>
  <text x="80" y="230" font-family="Songti SC, STSong, serif" font-size="64" fill="#2a241c">拂尘</text>
  <text x="80" y="278" font-family="Songti SC, STSong, serif" font-size="22" fill="#7a7166">浏览器里的整理工作台</text>
  <text x="80" y="360" font-family="Songti SC, STSong, serif" font-size="26" fill="#2a241c">选文件夹后扫描重复文件和尘余。</text>
  <text x="80" y="402" font-family="Songti SC, STSong, serif" font-size="26" fill="#2a241c">删除必须你确认，不会静默自动删。</text>
  <text x="80" y="500" font-family="Songti SC, STSong, serif" font-size="22" fill="#8a6a3b">能做什么</text>
  <text x="80" y="548" font-family="Songti SC, STSong, serif" font-size="24" fill="#2a241c">· Chrome / Edge 授权后扫描</text>
  <text x="80" y="592" font-family="Songti SC, STSong, serif" font-size="24" fill="#2a241c">· 同大小文件做指纹，保留原件</text>
  <text x="80" y="636" font-family="Songti SC, STSong, serif" font-size="24" fill="#2a241c">· 不授权也能先看演示流程</text>
  <text x="80" y="760" font-family="Songti SC, STSong, serif" font-size="22" fill="#7a7166">网页工具，不能远程操作电脑，</text>
  <text x="80" y="800" font-family="Songti SC, STSong, serif" font-size="22" fill="#7a7166">也不能在关掉窗口后后台删除。</text>
  <text x="80" y="980" font-family="Songti SC, STSong, serif" font-size="18" fill="#7a7166">拂尘 · 筹算 · 开窍 · 玄鉴</text>
</svg>
